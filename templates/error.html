{% extends "base.html" %}
{% block title %}Error - CyberBase{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-slate-800 border border-slate-700 rounded-lg p-6 space-y-3 text-center">
  <h1 class="text-2xl font-bold text-red-400">Something went wrong</h1>
  <p class="text-gray-300">{{ error }}</p>
  <div class="pt-2 flex flex-wrap items-center justify-center gap-3">
    <a href="/" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm text-gray-100">Home</a>
    <a href="/command-library" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm text-gray-100">Command Library</a>
    <a href="/toolbox" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm text-gray-100">Toolbox</a>
    <a href="/concepts" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm text-gray-100">Concepts</a>
    <a href="/defend" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm text-gray-100">Defend</a>
    <a href="/quiz" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm text-gray-100">Quiz</a>
    <a href="/analyze" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-sm text-gray-100">Log Analyzer</a>
  </div>
  <p class="text-xs text-gray-500">If a link is missing, use the top navigation.</p>
  </div>
{% endblock %}
