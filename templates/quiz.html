{% extends "base.html" %}
{# quiz.html v2 builds on v1: 30-question bank + 10-per-run sampling #}

{% block title %}{{ _('Quiz') }} - CyberBase{% endblock %}

{% block content %}
<div x-data="quizFlow()" x-init="init()" class="space-y-8">
  <div class="text-center mb-2">
    <h1 class="text-4xl font-bold mb-2">{{ _('Quiz') }}</h1>
  </div>

  <template x-if="mode==='topics'">
    <div>
      <template x-if="!topics.length">
        <div class="max-w-xl mx-auto p-5 bg-gray-800 rounded-lg text-center text-gray-300">
          {{ _('No quiz topics available right now.') }}
        </div>
      </template>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="g in topics" :key="g.id">
          <a :href="'/quiz?topic=' + encodeURIComponent(g.id)" @click.prevent="start(g.id)" class="block p-4 bg-gray-800 rounded-lg hover:bg-gray-700 transition">
            <h3 class="text-xl font-semibold" x-text="g.title"></h3>
            <p class="text-gray-400 text-sm mt-1" x-text="i18n.tenQuestions"></p>
          </a>
        </template>
      </div>
    </div>
  </template>

  <template x-if="mode==='session'">
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-2xl font-semibold" x-text="currentTopic.title"></h2>
          <p class="text-gray-400 text-sm" x-text="i18n.question + ' ' + (index+1) + ' ' + i18n.of + ' ' + total"></p>
        </div>
        <a href="/quiz" class="text-sm px-3 py-2 rounded bg-gray-700 hover:bg-gray-600">{{ _('New topic') }}</a>
      </div>

      <div class="p-5 bg-gray-800 rounded-lg">
        <template x-if="!review">
          <div>
            <p class="text-lg font-medium mb-4" x-text="currentQuestion.q"></p>
            <div class="space-y-2">
              <template x-for="(c, ci) in currentQuestion.choices" :key="ci">
                <button @click="select(ci)" class="w-full text-left px-4 py-3 rounded border transition"
                  :class="answers[index]===ci ? 'border-indigo-400 bg-indigo-900/20' : 'border-gray-700 hover:border-gray-500'">
                  <span x-text="c"></span>
                </button>
              </template>
            </div>

            <div class="flex items-center justify-between mt-5">
              <button class="px-3 py-2 rounded bg-gray-700 hover:bg-gray-600 disabled:opacity-50" @click="prev" :disabled="index===0">{{ _('Prev') }}</button>
              <button class="px-3 py-2 rounded bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50" @click="next" :disabled="answers[index]===null">{{ _('Next') }}</button>
            </div>
          </div>
        </template>

        <template x-if="review">
          <div>
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-xl font-semibold">{{ _('Results') }}</h3>
              <span class="text-sm px-2 py-1 rounded bg-gray-700" x-text="scoreText"></span>
            </div>
            <div class="space-y-4">
              <template x-for="(q, qi) in currentTopic.questions" :key="qi">
                <div class="p-4 rounded border border-gray-700">
                  <div class="flex items-start justify-between gap-3">
                    <p class="font-medium" x-text="(qi+1) + '. ' + q.q"></p>
                    <span class="text-xs px-2 py-1 rounded" :class="answers[qi]===q.answer ? 'bg-green-700' : 'bg-red-700'" x-text="answers[qi]===q.answer ? i18n.correct : i18n.wrong"></span>
                  </div>
                  <p class="text-sm text-gray-300 mt-2"><span class="text-gray-400" x-text="i18n.yourAnswer + ':'"></span> <span x-text="q.choices[answers[qi]]"></span></p>
                  <p class="text-sm text-gray-300"><span class="text-gray-400" x-text="i18n.correctAnswer + ':'"></span> <span x-text="q.choices[q.answer]"></span></p>
                  <p class="text-sm text-gray-400 mt-2" x-text="q.explain"></p>
                </div>
              </template>
            </div>
            <div class="mt-6 flex justify-end">
              <a href="/quiz" class="px-4 py-2 rounded bg-indigo-600 hover:bg-indigo-500">{{ _('Back to topics') }}</a>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</div>

<script>
  const QUIZ_DATA = {{ quiz|tojson }};
  const QUIZ_I18N = {
    tenQuestions: {{ _('10 Questions')|tojson }},
    question: {{ _('Question')|tojson }},
    of: {{ _('of')|tojson }},
    correct: {{ _('Correct')|tojson }},
    wrong: {{ _('Wrong')|tojson }},
    yourAnswer: {{ _('Your answer')|tojson }},
    correctAnswer: {{ _('Correct answer')|tojson }}
  };

  function quizFlow() {
    return {
      data: QUIZ_DATA,
      i18n: QUIZ_I18N,
      mode: 'topics',
      topics: [],
      currentTopic: null,
      index: 0,
      answers: [],
      review: false,
      runId: null,
      RUN_SIZE: 10,

      init() {
        this.topics = (this.data && this.data.quizzes) ? this.data.quizzes : [];

        window.addEventListener('popstate', () => {
          this.applyUrlState(true);
        });

        this.applyUrlState(false);
      },

      applyUrlState(fromPopstate) {
        const params = new URLSearchParams(window.location.search);
        let topicId = params.get('topic');
        let run = params.get('run');

        if (!topicId && window.location.hash) {
          const m = window.location.hash.match(/topic=([^&]+)/);
          if (m) topicId = decodeURIComponent(m[1]);
        }

        if (!topicId) {
          this.mode = 'topics';
          this.currentTopic = null;
          this.index = 0;
          this.answers = [];
          this.review = false;
          this.runId = null;
          return;
        }

        if (!run) {
          run = this.newRunId();
          this.beginRun(topicId, run);
          history.replaceState(null, '', `/quiz?topic=${encodeURIComponent(topicId)}&run=${encodeURIComponent(run)}`);
          return;
        }

        this.beginRun(topicId, run);
      },

      newRunId() {
        return String(Date.now()) + '_' + Math.random().toString(16).slice(2);
      },

      start(id) {
        const run = this.newRunId();
        this.beginRun(id, run);
        history.pushState(null, '', `/quiz?topic=${encodeURIComponent(id)}&run=${encodeURIComponent(run)}`);
      },

      beginRun(id, run) {
        const t = this.topics.find(x => x.id === id);
        if (!t) {
          this.mode = 'topics';
          return;
        }

        this.runId = run;

        const bank = JSON.parse(JSON.stringify(t.questions || []));
        const selected = this.selectRunQuestions(bank, id, run, this.RUN_SIZE);

        this.currentTopic = {
          id: t.id,
          title: t.title,
          questions: selected
        };

        this.mode = 'session';
        this.index = 0;
        this.answers = Array(this.currentTopic.questions.length).fill(null);
        this.review = false;
      },

      selectRunQuestions(bank, topicId, runId, n) {
        const seed = this.hashSeed(`${topicId}|${runId}`);
        const rand = this.mulberry32(seed);

        const idx = Array.from({ length: bank.length }, (_, i) => i);
        this.seededShuffle(idx, rand);

        const pickCount = Math.min(n, bank.length);
        const picked = idx.slice(0, pickCount).map(i => bank[i]);

        for (let qi = 0; qi < picked.length; qi++) {
          const q = picked[qi];
          this.shuffleChoicesSeeded(q, this.hashSeed(`${topicId}|${runId}|${q.q}`));
        }

        return picked;
      },

      hashSeed(str) {
        let h = 2166136261 >>> 0;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      },

      mulberry32(a) {
        return function() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        }
      },

      seededShuffle(arr, rand) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      },

      shuffleChoicesSeeded(question, seed) {
        const rand = this.mulberry32(seed);
        const indexed = question.choices.map((c, i) => ({ c, i }));

        for (let k = indexed.length - 1; k > 0; k--) {
          const j = Math.floor(rand() * (k + 1));
          [indexed[k], indexed[j]] = [indexed[j], indexed[k]];
        }

        question.choices = indexed.map(x => x.c);
        question.answer = indexed.findIndex(x => x.i === question.answer);
      },

      get currentQuestion() {
        return this.currentTopic.questions[this.index];
      },

      get total() {
        return this.currentTopic.questions.length;
      },

      select(ci) {
        this.answers[this.index] = ci;
      },

      next() {
        if (this.index < this.total - 1) {
          this.index++;
        } else {
          this.review = true;
        }
      },

      prev() {
        if (this.index > 0) this.index--;
      },

      get score() {
        if (!this.currentTopic) return 0;
        let s = 0;
        for (let i = 0; i < this.currentTopic.questions.length; i++) {
          if (this.answers[i] === this.currentTopic.questions[i].answer) s++;
        }
        return s;
      },

      get scoreText() {
        return `${this.score} / ${this.total}`;
      }
    }
  }
</script>
{% endblock %}
