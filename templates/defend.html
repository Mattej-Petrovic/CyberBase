{% extends "base.html" %}

{% block title %}Defend - CyberBase{% endblock %}

{% block content %}
<div x-data="{ defend: {{ defend|tojson }}, slug(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''); }, search:'' }" class="space-y-8">
  <div class="text-center mb-2">
    <h1 class="text-4xl font-bold mb-2">Defend</h1>
    <p class="text-gray-400">Detection, logging, and hardening priorities</p>
  </div>

  <div class="mb-4">
    <div class="relative">
      <input type="text" x-model="search" placeholder="Search defend topics..." class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-400/20">
      <svg class="absolute right-3 top-3 h-6 w-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </div>
  </div>

  <section>
    <h2 class="text-2xl font-bold mb-3">Detection and Logging</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
      <template x-for="d in (defend.detectionAndLogging || []).filter(x => (x.title + ' ' + (x.points||[]).join(' ')).toLowerCase().includes(search.toLowerCase()))" :key="d.id">
        <div :id="'def-' + slug(d.title)" x-data="{ open:false }" class="bg-slate-800 border border-slate-700 rounded-lg">
          <button @click="open=!open" class="w-full p-4 text-left hover:bg-slate-700 smooth-hover flex items-center justify-between">
            <h3 class="font-bold text-blue-300 text-lg" x-text="d.title"></h3>
            <svg class="h-5 w-5 text-gray-400 transition-transform" :class="open?'rotate-180':''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
          </button>
          <div x-show="open" class="p-4 border-t border-slate-700 slide-enter">
            <ul class="list-disc list-inside text-sm text-gray-400"><template x-for="p in d.points" :key="p"><li x-text="p"></li></template></ul>
          </div>
        </div>
      </template>
    </div>
  </section>

  <section>
    <h2 class="text-2xl font-bold mb-3">Hardening</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
      <template x-for="h in (defend.hardening || []).filter(x => (x.title + ' ' + (x.items||[]).join(' ')).toLowerCase().includes(search.toLowerCase()))" :key="h.id">
        <div :id="'def-' + slug(h.title)" x-data="{ open:false }" class="bg-slate-800 border border-slate-700 rounded-lg">
          <button @click="open=!open" class="w-full p-4 text-left hover:bg-slate-700 smooth-hover flex items-center justify-between">
            <h3 class="font-bold text-blue-300 text-lg" x-text="h.title"></h3>
            <svg class="h-5 w-5 text-gray-400 transition-transform" :class="open?'rotate-180':''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
          </button>
          <div x-show="open" class="p-4 border-t border-slate-700 slide-enter">
            <ul class="list-disc list-inside text-sm text-gray-400"><template x-for="it in h.items" :key="it"><li x-text="it"></li></template></ul>
          </div>
        </div>
      </template>
    </div>
  </section>
</div>
{% endblock %}
